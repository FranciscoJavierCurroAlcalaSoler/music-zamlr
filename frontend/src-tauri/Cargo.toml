[package]
name = "app"
version = "0.1.0"
description = "Music Zamlr desktop shell"
authors = ["Francisco Javier Alcalá Soler <254643964+FranciscoJavierCurroAlcalaSoler@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/FranciscoJavierCurroAlcalaSoler/music-zamlr"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
