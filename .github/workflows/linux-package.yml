name: Linux package

# Builds the .deb with its sources and notices, and attaches the four files
# to the run as one artifact. It publishes nothing. Run on request, it gives
# a package to install by hand; release.yml calls it rather than repeating
# its steps, because two copies of a build drift apart without a sign.
on:
  workflow_dispatch:
  workflow_call:

env:
  # Kept equal to the same variable in ci.yml and release.yml. A called
  # workflow does not inherit its caller's env, so this copy cannot go.
  FPCALC_VERSION: "1.6.1"

jobs:
  deb:
    # 22.04 and not ubuntu-latest. A program built here needs the C library
    # of this machine or a newer one, so the build machine sets the oldest
    # system the package runs on. 22.04 matches the oldest that Tauri 2
    # supports at all; 24.04 would lock out Ubuntu 22.04 and Debian 12.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # From the file that names the package, because a called workflow sees
      # no tag. release.yml has already checked the tag against this file.
      - name: Read the app version
        run: echo "VERSION=$(jq -r .version frontend/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      # Tauri's prerequisites for Debian and Ubuntu. The 4.1 WebKitGTK is the
      # one Tauri 2 builds against; 4.0 belongs to Tauri 1.
      - name: Install the Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      # binaries/ is gitignored, so without this the package ships an app
      # that compares by tags alone. tar keeps the execute permission that
      # the archive carries. Also put on PATH, for the packaged test that
      # hands the backend a configured fpcalc.
      - name: Install fpcalc into the shell's binaries
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSLf -o fpcalc.tar.gz "https://github.com/acoustid/chromaprint/releases/download/v${FPCALC_VERSION}/chromaprint-fpcalc-${FPCALC_VERSION}-linux-x86_64.tar.gz"
          tar xzf fpcalc.tar.gz
          folder="${{ runner.temp }}/chromaprint-fpcalc-${FPCALC_VERSION}-linux-x86_64"
          mkdir -p "${{ github.workspace }}/frontend/src-tauri/binaries"
          cp "$folder/fpcalc" "${{ github.workspace }}/frontend/src-tauri/binaries/"
          echo "$folder" >> "$GITHUB_PATH"

      # A check, not a print. The version is in the download URL only, and a
      # fingerprint from another fpcalc version does not match the ones that
      # users' databases already store.
      - name: Check the fpcalc version
        run: fpcalc -version | grep -F "fpcalc version ${FPCALC_VERSION} "

      - run: pyinstaller music-zamlr-backend.spec --noconfirm
        working-directory: backend

      # test_packaged_backend.py skips the whole module when this file is
      # missing, so a build under another name would let the next step pass
      # on four skips. -x and not -f: a program without the execute
      # permission fails here as well.
      - name: Check the backend build exists
        working-directory: backend
        run: |
          if [ ! -x dist/music-zamlr-backend/music-zamlr-backend ]; then
            echo "::error::PyInstaller produced no runnable dist/music-zamlr-backend/music-zamlr-backend"
            exit 1
          fi

      # The Linux bundle is not the Windows one, so it is checked on its own.
      # release.yml's Windows job gives the reason for the check.
      - name: Check the compiled packages are audited
        working-directory: backend
        run: python check_compiled_packages.py

      # fpcalc is LGPL-2.1, and the Linux binary also contains glibc, so the
      # release carries the complete source of both. The script holds the
      # pinned files and the reason for each.
      - name: Collect the fpcalc sources
        working-directory: backend
        run: python collect_fpcalc_sources.py "${{ runner.temp }}/fpcalc-sources" --platform linux

      # python -m pytest for the sys.path reason given in ci.yml.
      - run: python -m pytest tests/test_packaged_backend.py
        working-directory: backend

      # The binary is a GPL work because it bundles mutagen, so the release
      # carries the source of every Python package inside it. Read from this
      # build's tables and this job's Python, which produced the binary; the
      # Linux bundle is not the Windows one.
      - name: Collect the Python sources
        working-directory: backend
        run: python collect_python_sources.py "${{ runner.temp }}/python-sources"

      - run: python stage_backend.py
        working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # The same version and features as release.yml. rust-cache keeps
      # ~/.cargo/bin, so only the first run pays for the compile.
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli

      # Linux's crates differ from Windows' (GTK and WebKitGTK bindings in
      # place of WebView2). about.toml names the Windows target, so this
      # one is passed explicitly; without it the Linux notices list the
      # Windows crates and miss every GTK one, with the run still green.
      # The grep is what keeps that from coming back quietly.
      - name: Generate the Rust notices
        working-directory: frontend/src-tauri
        run: |
          cargo about generate --target x86_64-unknown-linux-gnu about.hbs -o "${{ runner.temp }}/THIRD-PARTY-RUST.txt"
          if ! grep -q "webkit2gtk" "${{ runner.temp }}/THIRD-PARTY-RUST.txt"; then
            echo "::error::The Rust notices do not name webkit2gtk, so they describe another platform's build"
            exit 1
          fi

      # Fails on any library without a notice: a system library no package
      # installed, a package without a copyright file, a Python or npm
      # package without a licence file.
      - name: Write the licence notices
        working-directory: backend
        run: >-
          python write_notices.py
          --output ../frontend/src-tauri/notices/THIRD-PARTY-NOTICES.txt
          --python-sources "${{ runner.temp }}/python-sources"
          --fpcalc-sources "${{ runner.temp }}/fpcalc-sources"
          --rust-notices "${{ runner.temp }}/THIRD-PARTY-RUST.txt"
          --frontend ../frontend

      # tauri.release.conf.json adds the notices to the bundle, as it does
      # for the Windows installer.
      - run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        working-directory: frontend

      # A package that dropped the execute permission installs without an
      # error, and the app then cannot start its backend. The notices must be
      # inside it too, where the licences require them. Nothing but the
      # package's own file list shows that before an installation. The
      # shell's own name is checked too: without mainBinaryName in
      # tauri.linux.conf.json it is installed as /usr/bin/app, after the
      # Cargo package, where another package can claim the same name.
      - name: Check the programs can run inside the package
        run: |
          deb=$(ls frontend/src-tauri/target/release/bundle/deb/*.deb)
          listing=$(dpkg-deb -c "$deb")
          # Printed before the checks, so a failed check shows what the
          # package holds instead of stopping before it.
          dpkg-deb -I "$deb"
          grep -v /_internal/ <<< "$listing"
          # Whole paths from the package root, with the leading ./ optional:
          # Tauri writes its archive without one, where dpkg-deb's own
          # packages carry it.
          for path in "usr/bin/music-zamlr" "usr/lib/Music Zamlr/backend/music-zamlr-backend" "usr/lib/Music Zamlr/backend/fpcalc"; do
            if ! grep -qE "^-rwx.* (\./)?${path}\$" <<< "$listing"; then
              echo "::error::$path is missing from $deb or cannot run"
              exit 1
            fi
          done
          if ! grep -qE " (\./)?usr/lib/Music Zamlr/THIRD-PARTY-NOTICES\.txt\$" <<< "$listing"; then
            echo "::error::The licence notices are missing from $deb"
            exit 1
          fi

      # GitHub turns spaces in an uploaded asset's name into dots, so the
      # bundler's "Music Zamlr_<version>_amd64.deb" would be published as
      # "Music.Zamlr_...". The platform in the other names, because the
      # Windows build attaches its own sources and notices to the same
      # release. Each zip is made from inside its folder, so the files sit
      # at its root, as Compress-Archive puts them on Windows.
      - name: Name the release files
        run: |
          (cd "${{ runner.temp }}/python-sources" && zip -qrX "$GITHUB_WORKSPACE/music-zamlr_${VERSION}_linux_python-sources.zip" .)
          (cd "${{ runner.temp }}/fpcalc-sources" && zip -qrX "$GITHUB_WORKSPACE/music-zamlr_${VERSION}_linux_fpcalc-sources.zip" .)
          mv "frontend/src-tauri/target/release/bundle/deb/Music Zamlr_${VERSION}_amd64.deb" "music-zamlr_${VERSION}_amd64.deb"
          cp frontend/src-tauri/notices/THIRD-PARTY-NOTICES.txt "music-zamlr_${VERSION}_linux_THIRD-PARTY-NOTICES.txt"
          ls -l music-zamlr_*

      # One name whether run by hand or by release.yml, which collects it
      # by this name.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: music-zamlr_*
          retention-days: 7
          # The default is warn, which ends a run that made no package green,
          # with nothing to download.
          if-no-files-found: error
