name: CI

# Every branch, so a deliberate-failure branch proves the workflow works
# without opening a pull request first.
#
# workflow_dispatch and schedule exist for the macOS leg of the backend
# matrix, which does not run on an ordinary push. See the strategy block
# below for why.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC. Only ever runs on the default branch.
    - cron: "0 6 * * 1"

# A second push while the first run is still going cancels it, so the result
# you are looking at always belongs to the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, and it has to be. fpcalc has no lockfile, and a fingerprint is
  # stored rather than recomputed — so a runner on a different version would
  # compare stored values against values another release produced, which is
  # the one failure this project cannot detect. Keep this equal to the
  # version in ENVIRONMENT.md, and move both together or neither.
  FPCALC_VERSION: "1.6.1"

jobs:
  # Two jobs rather than one with six commands. Steps stop at the first
  # failure, so a single job would let a ruff complaint hide every TypeScript
  # result. They also run in parallel.
  backend:
    # The path conventions in this codebase are cross-platform claims —
    # casefold where the question is "could these collide on disk", exact
    # match where it is "which row is this file". macOS is the third case
    # and not a redundant one: its default APFS is case-insensitive like
    # Windows but case-preserving with POSIX path semantics like Linux, so
    # it is the only runner that can disagree with both. fpcalc, a
    # per-platform system binary, widens the surface further.
    runs-on: ${{ matrix.os }}
    strategy:
      # False, deliberately. The default cancels the sibling legs as soon as
      # one fails, which destroys the only thing this matrix is for: "broken
      # on Windows only" and "broken everywhere" are different diagnoses and
      # a cancelled leg cannot tell them apart.
      fail-fast: false
      matrix:
        # macOS bills at 10x the Linux rate against the 2,000 free minutes a
        # private repo gets, and a job is rounded up to the whole minute — so
        # one macOS leg costs more than every other job in this file put
        # together. It runs weekly and on demand instead of on every push.
        # A public repository runs on standard runners without metering, and
        # there this expression can become a plain list of all three.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    # A hung job otherwise bills until the 6-hour default. On macOS that is
    # 3,600 billed minutes, which is the whole monthly allowance twice over,
    # from a single stuck run.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # "3.14" rather than "3.14.6": the minor version resolves to whatever
      # patch the runner image already has, where an exact patch that is not
      # preinstalled means a slow source build or a hard failure.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # No venv. The runner's Python is disposable and already isolated.
      - run: pip install -r requirements.txt

      # fpcalc comes from the project's own release rather than from a package
      # manager, on all three runners, for one reason: version control.
      # apt's libchromaprint-tools and Homebrew's chromaprint each ship
      # whatever their distribution froze, so the three legs would test three
      # different fpcalc versions and none of them the one on the dev machine.
      # Chocolatey was the obvious Windows answer and is the worst of the
      # three — its chromaprint package sits at 1.1, more than a decade behind.
      #
      # Downloading with curl also sidesteps macOS Gatekeeper, which
      # quarantines archives fetched by a browser but not by a command-line
      # tool.
      #
      # Each archive holds one folder named after itself, containing the
      # binary alone, so the extracted path is predictable. GITHUB_PATH takes
      # effect in later steps, never the current one, which is why the version
      # check below is its own step.
      - name: Install fpcalc (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSLf -o fpcalc.tar.gz "https://github.com/acoustid/chromaprint/releases/download/v${{ env.FPCALC_VERSION }}/chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-linux-x86_64.tar.gz"
          tar xzf fpcalc.tar.gz
          echo "${{ runner.temp }}/chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-linux-x86_64" >> "$GITHUB_PATH"

      # The universal build, not macos-x86_64: GitHub's macos-latest runners
      # are Apple Silicon, and nothing guarantees Rosetta 2 is present.
      - name: Install fpcalc (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSLf -o fpcalc.tar.gz "https://github.com/acoustid/chromaprint/releases/download/v${{ env.FPCALC_VERSION }}/chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-macos-universal.tar.gz"
          tar xzf fpcalc.tar.gz
          echo "${{ runner.temp }}/chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-macos-universal" >> "$GITHUB_PATH"

      - name: Install fpcalc (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/acoustid/chromaprint/releases/download/v${{ env.FPCALC_VERSION }}/chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-windows-x86_64.zip" -OutFile fpcalc.zip
          Expand-Archive fpcalc.zip -DestinationPath .
          Add-Content $env:GITHUB_PATH "${{ runner.temp }}\chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-windows-x86_64"

      # Proves the PATH entry took, on every runner. Without this the
      # fpcalc-dependent tests would skip themselves and the job would stay
      # green while testing nothing.
      - run: fpcalc -version

      - run: ruff check .

      # --check, never the bare form: `ruff format` rewrites the files and
      # exits 0, so the job would pass having fixed something that is thrown
      # away with the runner.
      - run: ruff format --check .

      # python -m pytest, never bare pytest. The -m form prepends the current
      # directory to sys.path; the bare entry point does not, and tests/ has
      # no __init__.py, so pytest puts backend/tests on the path instead of
      # backend. conftest.py's `import database` then fails to resolve.
      - run: python -m pytest

  # Not matrixed. tsc, eslint, prettier and Vitest read files and emit
  # diagnostics; none of them touch a path the way the backend does, and the
  # one real cross-platform frontend hazard — CRLF failing
  # `prettier --check` — is already pinned by .gitattributes and the
  # editor's files.eol, both of which apply before CI ever sees the tree.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json disagrees with it. install would quietly rewrite the
      # lock, and CI would then test a dependency tree that is not ours.
      - run: npm ci

      # npm run typecheck, never npx tsc --noEmit. The root tsconfig.json has
      # "files": [] and delegates to project references, so --noEmit checks
      # zero files and exits 0 — the job would be permanently, meaninglessly
      # green.
      - run: npm run typecheck

      - run: npm run lint

      - run: npx prettier --check src/

      - run: npm run test
