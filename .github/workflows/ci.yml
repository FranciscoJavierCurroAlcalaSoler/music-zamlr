name: CI

# Every branch, so a deliberate-failure branch proves the workflow works
# without opening a pull request first.
on:
  push:
  pull_request:

# A second push while the first run is still going cancels it, so the result
# you are looking at always belongs to the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs rather than one with six commands. Steps stop at the first
  # failure, so a single job would let a ruff complaint hide every TypeScript
  # result. They also run in parallel.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # "3.14" rather than "3.14.6": the minor version resolves to whatever
      # patch the runner image already has, where an exact patch that is not
      # preinstalled means a slow source build or a hard failure.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # No venv. The runner's Python is disposable and already isolated.
      - run: pip install -r requirements.txt

      - run: ruff check .

      # --check, never the bare form: `ruff format` rewrites the files and
      # exits 0, so the job would pass having fixed something that is thrown
      # away with the runner.
      - run: ruff format --check .

      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json disagrees with it. install would quietly rewrite the
      # lock, and CI would then test a dependency tree that is not ours.
      - run: npm ci

      # npm run typecheck, never npx tsc --noEmit. The root tsconfig.json has
      # "files": [] and delegates to project references, so --noEmit checks
      # zero files and exits 0 — the job would be permanently, meaninglessly
      # green.
      - run: npm run typecheck

      - run: npm run lint

      - run: npx prettier --check src/

      - run: npm run test
