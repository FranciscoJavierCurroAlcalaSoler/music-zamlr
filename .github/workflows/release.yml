name: Release

# Only a version tag builds an installer. This lives apart from ci.yml
# because creating a release needs `contents: write`, and ci.yml runs on
# every push to every branch, where that permission has no business.
on:
  push:
    tags: ["v*"]

env:
  # Kept equal to the same variable in ci.yml and to ENVIRONMENT.md. The
  # fingerprints an installed app stores have to come from the version
  # every test ran against.
  FPCALC_VERSION: "1.6.1"

jobs:
  installer:
    runs-on: windows-latest
    # A cold Rust release build plus PyInstaller takes a while, but a hung
    # job otherwise bills until the six-hour default, at twice the Linux
    # rate while the repository is private.
    timeout-minutes: 45
    permissions:
      contents: write
    # No concurrency group with cancel-in-progress, unlike ci.yml: a release
    # cancelled halfway can leave a draft behind with no installer on it.
    steps:
      - uses: actions/checkout@v7

      # Tagging v0.2.0 without raising the version in tauri.conf.json would
      # publish a release named 0.2.0 whose installer says 0.1.0 and
      # installs as 0.1.0. The installer takes its version from that file
      # alone; package.json's is never read.
      - name: Check the tag against the app version
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          $version = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in tauri.conf.json"
          }
          Add-Content $env:GITHUB_ENV "VERSION=$version"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      # binaries/ is gitignored, so a checkout has no fpcalc in it. The shell
      # starts without one, since a missing fpcalc is a mode the app already
      # has, and the installer would ship an app that compares by tags alone
      # with nothing anywhere saying so. Also put on PATH, for the packaged
      # test that hands the backend a configured fpcalc.
      - name: Install fpcalc into the shell's binaries
        working-directory: ${{ runner.temp }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/acoustid/chromaprint/releases/download/v${{ env.FPCALC_VERSION }}/chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-windows-x86_64.zip" -OutFile fpcalc.zip
          Expand-Archive fpcalc.zip -DestinationPath .
          $folder = "${{ runner.temp }}\chromaprint-fpcalc-${{ env.FPCALC_VERSION }}-windows-x86_64"
          $binaries = "${{ github.workspace }}\frontend\src-tauri\binaries"
          New-Item -ItemType Directory -Force $binaries | Out-Null
          Copy-Item "$folder\fpcalc.exe" $binaries
          Add-Content $env:GITHUB_PATH $folder

      - run: fpcalc -version

      - run: pyinstaller music-zamlr-backend.spec --noconfirm
        working-directory: backend

      # test_packaged_backend.py skips the whole module when no build
      # exists, so a build that landed somewhere else would make the next
      # step pass on four skips. The skip condition is exactly this file
      # being missing, so asserting it is here makes the skip impossible.
      - name: Check the backend build exists
        working-directory: backend
        run: |
          if (-not (Test-Path dist/music-zamlr-backend/music-zamlr-backend.exe)) {
            throw "PyInstaller produced no dist/music-zamlr-backend/music-zamlr-backend.exe"
          }

      # The only place outside the development machine where these run.
      # python -m pytest for the sys.path reason given in ci.yml.
      - run: python -m pytest tests/test_packaged_backend.py
        working-directory: backend

      # The binary is a GPL work because it bundles mutagen, so the release
      # carries the source of every Python package inside it. Here, straight
      # after the build, because the list is read from PyInstaller's build
      # tables and the versions from this job's Python, which is the one
      # that produced the binary.
      - name: Collect the Python sources
        working-directory: backend
        run: python collect_python_sources.py "${{ runner.temp }}/python-sources"

      - name: Archive the Python sources
        run: |
          Compress-Archive -Path "${{ runner.temp }}/python-sources/*" `
            -DestinationPath "music-zamlr_${env:VERSION}_python-sources.zip"

      # fpcalc is LGPL-2.1 as a whole, because it links FFmpeg statically,
      # and the LGPL counts the scripts that control a library's
      # compilation as part of its source. Traced from the source rather
      # than assumed: Chromaprint 1.6.1's package/build.sh pins FFmpeg 8.0
      # from acoustid/ffmpeg-build's v8.0-1 release, and that repository's
      # common.sh at the same tag fetches ffmpeg-8.0.tar.gz from ffmpeg.org.
      #
      # Pinned by hash. GitHub generates tag archives on demand and does not
      # promise the same bytes every time. A mismatch stops the release,
      # which is the right direction for a file the release must carry.
      - name: Collect the fpcalc sources
        run: |
          # The three files below belong to fpcalc 1.6.1 and to nothing
          # else. Raising FPCALC_VERSION without this guard would ship a
          # binary next to source that is not its own, with every check
          # green; with it, the bump forces the sources to be traced again.
          if ($env:FPCALC_VERSION -ne "1.6.1") {
            throw "Collect the fpcalc sources pins the sources of fpcalc 1.6.1, not $env:FPCALC_VERSION. Trace and re-pin them."
          }
          $folder = "${{ runner.temp }}/fpcalc-sources"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $sources = @(
            @{
              url = "https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-1.6.1.tar.gz"
              file = "chromaprint-1.6.1.tar.gz"
              sha256 = "3368805af0ee47b9df74df10b5001a44569e01df2844dab520031720dde9ad23"
            },
            @{
              url = "https://ffmpeg.org/releases/ffmpeg-8.0.tar.gz"
              file = "ffmpeg-8.0.tar.gz"
              sha256 = "cce1136d38c389e6baaa452d6babc384cb2d3a9406ebe48c36a48f3ee115d8df"
            },
            @{
              url = "https://github.com/acoustid/ffmpeg-build/archive/refs/tags/v8.0-1.tar.gz"
              file = "ffmpeg-build-v8.0-1.tar.gz"
              sha256 = "2533f000cc9d4ea72e5108c95bf2cc59770fa076ad8d4147e66ff5c16e42de14"
            }
          )
          foreach ($source in $sources) {
            $path = Join-Path $folder $source.file
            Invoke-WebRequest -Uri $source.url -OutFile $path
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash
            if ($actual -ne $source.sha256) {
              throw "$($source.file) has sha256 $actual, expected $($source.sha256)"
            }
          }
          Set-Content -Encoding utf8 -Path (Join-Path $folder "README.txt") -Value @"
          The source of fpcalc 1.6.1, the fingerprinting program shipped with
          Music Zamlr. fpcalc is distributed under the GNU Lesser General Public
          License, version 2.1, because it is linked statically with FFmpeg.

          chromaprint-1.6.1.tar.gz
              Chromaprint 1.6.1, which provides fpcalc. Its package/build.sh is
              the script that built the Windows binary, and it names the FFmpeg
              build below.

          ffmpeg-build-v8.0-1.tar.gz
              The scripts from acoustid/ffmpeg-build, release v8.0-1, that
              configured and compiled the FFmpeg libraries fpcalc links with.
              They configure FFmpeg without --enable-gpl and without
              --enable-nonfree, so the libraries are under the LGPL.

          ffmpeg-8.0.tar.gz
              FFmpeg 8.0, as downloaded from ffmpeg.org by those scripts.

          To rebuild fpcalc with a modified FFmpeg, build FFmpeg with the
          scripts in ffmpeg-build-v8.0-1.tar.gz, then build Chromaprint against
          it with package/build.sh.
          "@

      - name: Archive the fpcalc sources
        run: |
          Compress-Archive -Path "${{ runner.temp }}/fpcalc-sources/*" `
            -DestinationPath "music-zamlr_${env:VERSION}_fpcalc-sources.zip"

      - run: python stage_backend.py
        working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # The runner image already carries stable Rust and the MSVC linker.
      # Without the cache every release compiles the whole Tauri dependency
      # tree from nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # Pinned to the version in ENVIRONMENT.md, so CI renders the template
      # as a local preview does. --features cli is not optional: without it
      # the install succeeds and builds no binary. rust-cache keeps
      # ~/.cargo/bin, so only the first run pays for the compile.
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli

      # Generated here rather than committed. A committed copy falls behind
      # Cargo.lock without a sign whenever a crate is added; generated from
      # the lockfile being built, it cannot.
      - name: Generate the Rust notices
        working-directory: frontend/src-tauri
        run: cargo about generate about.hbs -o "${{ runner.temp }}/THIRD-PARTY-RUST.txt"

      # After npm ci and after the fpcalc sources, because it reads both:
      # the licence files in node_modules, and fpcalc's and FFmpeg's licence
      # texts out of the source tarballs.
      - name: Write the licence notices
        working-directory: backend
        run: >-
          python write_notices.py
          --output ../frontend/src-tauri/notices/THIRD-PARTY-NOTICES.txt
          --fpcalc-sources "${{ runner.temp }}/fpcalc-sources"
          --rust-notices "${{ runner.temp }}/THIRD-PARTY-RUST.txt"
          --frontend ../frontend

      # tauri.release.conf.json adds the notices to the bundle. It is merged
      # in here rather than written into tauri.conf.json because Tauri copies
      # resources during `tauri dev` as well, and a resource that exists only
      # after this job has written it would break every development build.
      - run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        working-directory: frontend

      # GitHub turns spaces in an uploaded asset's name into dots, so the
      # bundler's "Music Zamlr_<version>_x64-setup.exe" would be published
      # as "Music.Zamlr_...". A name chosen here is also one the README can
      # quote. The notices go on the release as well as into the installer,
      # so they can be read before anything is installed.
      - name: Name the release files
        run: |
          $built = "frontend/src-tauri/target/release/bundle/nsis/Music Zamlr_${env:VERSION}_x64-setup.exe"
          Move-Item -LiteralPath $built "music-zamlr_${env:VERSION}_x64-setup.exe"
          Copy-Item frontend/src-tauri/notices/THIRD-PARTY-NOTICES.txt `
            "music-zamlr_${env:VERSION}_THIRD-PARTY-NOTICES.txt"

      # Every file the licences require travels together: the backend is
      # GPL-3.0-or-later as a whole because it bundles mutagen, fpcalc is
      # LGPL-2.1, and a release missing either source archive or the notices
      # breaches them on the first download. GitHub adds the repository's
      # own source archive at the tag by itself.
      #
      # Still a draft. The owner publishes it by hand, after this tag's CI
      # run has passed — it goes in parallel and this job cannot wait for
      # it — and after downloading the installer to see the SmartScreen
      # warning a user sees.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "music-zamlr_${env:VERSION}_x64-setup.exe" `
            "music-zamlr_${env:VERSION}_python-sources.zip" `
            "music-zamlr_${env:VERSION}_fpcalc-sources.zip" `
            "music-zamlr_${env:VERSION}_THIRD-PARTY-NOTICES.txt" `
            --draft `
            --title "Music Zamlr ${env:VERSION}" `
            --generate-notes
